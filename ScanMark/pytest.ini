[pytest]
# Keep the suite noise-free: SQLAlchemy 2.x LegacyAPIWarning fires on the
# Query.get() calls that still live in app.py. Surfaced deliberately rather
# than silenced globally, so the filter can be dropped when those are migrated.
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*Query.get\(\).*:sqlalchemy.exc.LegacyAPIWarning
testpaths = .
