<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ course.code }} Analytics - ScanMark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Custom ScanMark Brand Styles */
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Smooth Slide-Up Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Premium Card Styling */
        .glass-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(10, 25, 47, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(10, 25, 47, 0.08);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4 fade-in-up">
            <div>
                <h2 class="fw-bold mb-1" style="color: #0A192F;">{{ course.code }} Analytics</h2>
                <p class="text-muted mb-0">Live attendance trends and course health</p>
            </div>
            <a href="{{ url_for('lecturer_dashboard') }}"
                class="btn btn-light border shadow-sm fw-semibold rounded-pill px-4 py-2 hover-shadow">
                ← Back to Dashboard
            </a>
        </div>

        <div class="row mb-4 fade-in-up delay-1" id="quickStatsRow" style="display: none;">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="glass-card p-4 d-flex align-items-center border-0">
                    <div class="stat-icon me-3" style="background: rgba(25, 135, 84, 0.1); color: #198754;">📈</div>
                    <div>
                        <p class="text-muted mb-0 fw-semibold text-uppercase" style="font-size: 0.8rem;">Peak Attendance
                        </p>
                        <h3 class="fw-bold mb-0" style="color: #0A192F;" id="stat-peak">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card p-4 d-flex align-items-center border-0">
                    <div class="stat-icon me-3" style="background: rgba(0, 122, 255, 0.1); color: #007AFF;">👥</div>
                    <div>
                        <p class="text-muted mb-0 fw-semibold text-uppercase" style="font-size: 0.8rem;">Average Turnout
                        </p>
                        <h3 class="fw-bold mb-0" style="color: #0A192F;" id="stat-avg">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card border-0 mb-4 fade-in-up delay-2">
            <div class="card-body p-4 p-lg-5">
                <h5 class="fw-bold mb-4" style="color: #0A192F;">Daily Attendance Volume</h5>

                <canvas id="attendanceChart" height="100"></canvas>

                {% if not dates %}
                <div class="text-center text-muted mt-4 p-5 border rounded-4 bg-light shadow-sm">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">📭</div>
                    <h5 class="fw-bold text-dark">No Data Yet</h5>
                    <p class="mb-0">Run a live class to generate your first attendance insights!</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script id="chart-dates" type="application/json">{{ dates | tojson | safe }}</script>
    <script id="chart-counts" type="application/json">{{ counts | tojson | safe }}</script>
    <script>
        const chartLabels = JSON.parse(document.getElementById('chart-dates').textContent || '[]');
        const chartData = JSON.parse(document.getElementById('chart-counts').textContent || '[]');

        if (chartLabels.length > 0) {
            // 1. Calculate and Inject the Quick Stats
            const peak = Math.max(...chartData);
            const avg = Math.round(chartData.reduce((a, b) => a + b, 0) / chartData.length);

            document.getElementById('stat-peak').innerText = peak + " Students";
            document.getElementById('stat-avg').innerText = "~" + avg + " / class";
            document.getElementById('quickStatsRow').style.display = 'flex'; // Unhide the stats row

            // 2. Build the Premium Chart
            const ctx = document.getElementById('attendanceChart').getContext('2d');

            // Create a stunning brand-aligned gradient for the fill area
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(25, 135, 84, 0.4)'); // Solid Success Green at top
            gradient.addColorStop(1, 'rgba(25, 135, 84, 0.0)'); // Fades to transparent at bottom

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Total Students Present',
                        data: chartData,
                        borderColor: '#198754',
                        backgroundColor: gradient, // Apply the custom gradient
                        borderWidth: 3,
                        pointBackgroundColor: '#0A192F',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        fill: true,
                        tension: 0.4 // Extra smooth curve
                    }]
                },
                options: {
                    responsive: true,
                    animation: {
                        duration: 2000, // Silky 2-second draw animation
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0A192F', // Navy tooltip
                            titleFont: { size: 14, family: 'Segoe UI' },
                            bodyFont: { size: 14, weight: 'bold' },
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { borderDash: [5, 5], color: '#e9ecef' },
                            ticks: { precision: 0, font: { weight: '500' } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { weight: '500' } }
                        }
                    }
                }
            });
        }
    </script>

</body>

</html>
