<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ course.code }} Analytics - ScanMark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark">{{ course.code }} Analytics</h2>
                <p class="text-muted">Attendance trends and course health</p>
            </div>
            <a href="{{ url_for('lecturer_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3" style="color: #0A192F;">Daily Attendance Volume</h5>

                <canvas id="attendanceChart" height="100"></canvas>

                {% if not dates %}
                <div class="text-center text-muted mt-4 p-4 border rounded bg-light">
                    <p class="mb-0">No attendance data collected yet. Run a live class to generate insights!</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script id="dates-data" type="application/json">
        {{ dates | tojson | safe }}
    </script>
    <script id="counts-data" type="application/json">
        {{ counts | tojson | safe }}
    </script>

    <script>
        // Grab the data passed directly from your Flask route
        const chartLabels = JSON.parse(document.getElementById('dates-data').textContent);
        const chartData = JSON.parse(document.getElementById('counts-data').textContent);

        // Only draw the chart if we have data
        if (chartLabels.length > 0) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Total Students Present',
                        data: chartData,
                        borderColor: '#198754', // ScanMark Success Green
                        backgroundColor: 'rgba(25, 135, 84, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#0A192F', // Deep Navy points
                        pointRadius: 5,
                        fill: true,
                        tension: 0.3 // Gives the line a smooth curve
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false } // Hides the legend for a cleaner look
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 } // No decimal students allowed!
                        }
                    }
                }
            });
        }
    </script>

</body>

</html>
