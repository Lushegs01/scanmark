{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <span style="font-size: 3rem;">🔒</span>
                        <h3 class="fw-bold mt-2">Forgot Password?</h3>
                        <p class="text-muted small">Enter your FUNAAB email address and we'll send you a secure link to
                            reset it.</p>
                    </div>

                    <form method="POST" action="/forgot_password">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                            <input type="email" name="email" class="form-control form-control-lg"
                                placeholder="student@funaab.edu.ng" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                Send Reset Link
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="/login" class="text-decoration-none small fw-bold text-muted">
                            ← Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
