{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-success">Set New Password</h3>
                        <p class="text-muted small">Your identity has been verified. Please choose a strong new
                            password.</p>
                    </div>

                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">NEW PASSWORD</label>
                            <div class="input-group">
                                <input type="password" name="password" id="passwordInput"
                                    class="form-control form-control-lg" placeholder="••••••••" required>
                                <span class="input-group-text" id="togglePassword"
                                    style="cursor: pointer; background: white;">
                                    <i class="fa fa-eye" id="eyeIcon"></i>
                                </span>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg shadow-sm">
                                Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Reusing the same logic from your login screen
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#passwordInput');
    const icon = document.querySelector('#eyeIcon');

    togglePassword.addEventListener('click', function (e) {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);

        if (type === 'text') {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
{% endblock %}
