name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ScanMark

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ScanMark/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      # Every undefined name that reached main (selectinload, joinedload, json,
      # enrollments, IntegrityError, event, email_executor) would have been
      # caught right here, in under a second, before anything else ran.
      # `email_executor` in particular reached production and 500'd signup:
      # this job must be a REQUIRED check on the branch, or it just watches.
      - name: Static check for undefined names
        run: |
          python -m pyflakes app.py models.py campos_integration.py \
                             localtime.py academic.py \
                             performance.py conftest.py \
                             test_app.py test_performance.py test_bugfixes.py test_auth.py \
                             test_scan_limits.py test_scan_validation.py \
                             benchmarks/*.py loadtest/*.py

      - name: Check the browser JavaScript parses
        run: |
          node --check static/scanner.js
          node --check static/service-worker.js
          node --check static/auth.js
          node --test test_auth_browser.cjs

      - name: Check every Jinja template compiles
        env:
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite:///ci-templates.db
          FLASK_ENV: ci
          SCANMARK_DISABLE_SCHEDULER: "1"
        run: |
          python -c "
          import os, app
          env = app.app.jinja_env
          for name in sorted(os.listdir('templates')):
              env.get_template(name)
          print(f'{len(os.listdir(\"templates\"))} templates compile')
          "

      - name: Import the app (runs create_all + migrations + backfill)
        env:
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite:///ci-boot.db
          FLASK_ENV: ci
        run: python -c "import app; print('boot ok')"

      # A second import over the same file exercises the idempotent migration
      # and backfill path that every real redeploy takes.
      - name: Import a second time on the same database
        env:
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite:///ci-boot.db
          FLASK_ENV: ci
        run: python -c "import app; print('reboot ok')"

      - name: Run the test suite
        run: python -m pytest -q

  postgres:
    name: Boot against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scanmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ScanMark/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Production runs Postgres + Redis, and some code paths (the migration
      # DDL, the Redis-backed QR/session/limiter stores) only exist there.
      - name: Boot the real Procfile command and probe it
        # Deliberately no SCANMARK_ENV/FLASK_ENV: an undeclared environment
        # is production, so this step is also the check that the production
        # startup path — real secret, Postgres, Redis, canonical origin — can
        # actually boot.
        env:
          SECRET_KEY: ci-secret-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scanmark
          REDIS_URL: redis://localhost:6379/0
          PUBLIC_ORIGIN: http://127.0.0.1:8100
          MAIL_SERVER: 127.0.0.1
          MAIL_PORT: 2525
          WEB_CONCURRENCY: "2"
          GUNICORN_CMD_ARGS: "-b 127.0.0.1:8100"
        run: |
          gunicorn --config gunicorn.conf.py app:app &
          for _ in $(seq 1 30); do
            # /livez is the process probe; /healthz reaches Postgres and Redis
            # and is what proves this instance can actually serve.
            if curl -sf http://127.0.0.1:8100/healthz -o /dev/null; then
              echo "healthz ok (database and redis reachable)"
              curl -sf http://127.0.0.1:8100/livez -o /dev/null && echo "livez ok"
              curl -sf http://127.0.0.1:8100/login -o /dev/null && echo "login ok"
              pkill -x gunicorn
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          pkill -x gunicorn || true
          exit 1

      # The suite runs on SQLite with no Redis by default, which is why a
      # whole class of Redis state-leakage bug was invisible: pinned
      # classrooms and cached headcounts persisted between tests, and ids
      # repeat, so a test expecting no geofence silently got one. Run it
      # against the real services too.
      - name: Run the test suite against Postgres and Redis
        env:
          SECRET_KEY: ci-secret-key
          FLASK_ENV: ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scanmark
          SCANMARK_TEST_REDIS_URL: redis://localhost:6379/9
          MAIL_SERVER: 127.0.0.1
          MAIL_PORT: 2525
        run: python -m pytest -q

      - name: Refuse to boot production without its dependencies
        env:
          SECRET_KEY: ci-secret-key
          PUBLIC_ORIGIN: http://127.0.0.1:8100
        run: |
          cd "$GITHUB_WORKSPACE/ScanMark"
          # No DATABASE_URL and no REDIS_URL, environment undeclared: the
          # process must refuse rather than fall back to SQLite and cookies.
          if python -c "import app" 2>/tmp/boot.log; then
            echo "production booted without Postgres or Redis"; exit 1
          fi
          grep -q CRITICAL /tmp/boot.log && echo "refused to boot, as intended"
