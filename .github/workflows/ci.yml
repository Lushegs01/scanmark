name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ScanMark/requirements.txt

      - name: Install dependencies
        working-directory: ScanMark
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ScanMark
        run: pytest tests -q
